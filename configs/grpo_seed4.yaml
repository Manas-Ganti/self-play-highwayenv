# GRPO, seed 4. Same env, same reward, same step budget as ppo_seed4.
# n_envs is DERIVED: group_size * n_groups = 8 * 4 = 32.
name: grpo_seed4
algo: grpo
seed: 4
group: grpo_solo

total_steps: 2_000_000
n_envs: 32
device: auto

eval_every: 100_000
eval_episodes: 20
checkpoint_every: 250_000

env:
  track: a
  n_traffic: 4
  n_agents: 1
  obs_type: kinematics
  vehicles_count: 5
  laps_to_finish: 1
  duration: 60
  policy_frequency: 5
  seed: 4

grpo:
  learning_rate: 3.0e-4
  n_epochs: 10
  batch_size: 256
  clip_range: 0.2
  entropy_coef: 0.01
  max_grad_norm: 0.5
  hidden_sizes: [64, 64]
  log_std_init: -0.5
  group_size: 8            # G: rollouts sharing one reset state
  n_groups: 4              # groups per update
  per_timestep_advantages: false   # GRPO-t; Phase 4 diagnostic only
